# Production stack: Redmine + PostgreSQL. Nothing else.
#
# The local development identity provider (Keycloak) lives in
# docker-compose.dev.yml and is pulled in automatically on a developer machine
# through COMPOSE_FILE in .env. A server .env does not set that variable, so a
# server can never start the demo identity provider by accident.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-redmine_production}
      POSTGRES_USER: ${DB_USER:-redmine}
      POSTGRES_PASSWORD: ${DB_PASS:?set DB_PASS in .env}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-redmine}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redmine:
    # Official Redmine 7.0 image + one-line Dockerfile fix for /themes asset
    # serving. The entrypoint runs `bundle check || bundle install` (plugin gems)
    # and, with REDMINE_PLUGINS_MIGRATE set, the plugin migrations on start.
    build: .
    image: dee-redmine:${REDMINE_VERSION:-7.0}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      # On a server set REDMINE_BIND=127.0.0.1 in .env, so only the reverse proxy
      # on the same host can reach Redmine and it is never exposed directly.
      - "${REDMINE_BIND:-0.0.0.0}:${REDMINE_PORT:-3000}:3000"
    environment:
      REDMINE_DB_POSTGRES: db
      REDMINE_DB_PORT: "5432"
      REDMINE_DB_DATABASE: ${DB_NAME:-redmine_production}
      REDMINE_DB_USERNAME: ${DB_USER:-redmine}
      REDMINE_DB_PASSWORD: ${DB_PASS:?set DB_PASS in .env}
      REDMINE_SECRET_KEY_BASE: ${REDMINE_SECRET_KEY_BASE:?set REDMINE_SECRET_KEY_BASE in .env}
      REDMINE_PLUGINS_MIGRATE: "1"
    volumes:
      - files_data:/usr/src/redmine/files
      - ./plugins:/usr/src/redmine/plugins
      # DEE theme (colours adjustable) — single-theme mount keeps built-ins intact
      - ./themes/dee:/usr/src/redmine/themes/dee

volumes:
  db_data:
  files_data:
