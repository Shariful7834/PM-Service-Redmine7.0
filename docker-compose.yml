services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-redmine_production}
      POSTGRES_USER: ${DB_USER:-redmine}
      POSTGRES_PASSWORD: ${DB_PASS:?set DB_PASS in .env}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-redmine}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redmine:
    # OFFICIAL Redmine 7.0 image (published ~2026-07-27) + one-line Dockerfile fix
    # for /themes asset serving. Previous sameersbn setup kept as
    # docker-compose.sameersbn.yml for rollback. Same postgres volume/creds, so all
    # data (projects, wiki, oauth providers) carries over.
    # Entrypoint runs `bundle check || bundle install` (plugin gems) and, with
    # REDMINE_PLUGINS_MIGRATE set, `rake redmine:plugins:migrate` on start.
    build: .
    image: dee-redmine:${REDMINE_VERSION:-7.0}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${REDMINE_PORT:-3000}:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      REDMINE_DB_POSTGRES: db
      REDMINE_DB_PORT: "5432"
      REDMINE_DB_DATABASE: ${DB_NAME:-redmine_production}
      REDMINE_DB_USERNAME: ${DB_USER:-redmine}
      REDMINE_DB_PASSWORD: ${DB_PASS:?set DB_PASS in .env}
      REDMINE_SECRET_KEY_BASE: ${REDMINE_SECRET_KEY_BASE:?set REDMINE_SECRET_KEY_BASE in .env}
      REDMINE_PLUGINS_MIGRATE: "1"
    volumes:
      - files_data:/usr/src/redmine/files
      - ./plugins:/usr/src/redmine/plugins
      # DEE theme (colors adjustable) — single-theme mount keeps built-ins intact
      - ./themes/dee:/usr/src/redmine/themes/dee

  # Local identity provider for the OAuth/OIDC proof-of-concept. Replaced by the
  # real DEE user service on the server (change Site/Tenant/Client-ID/Secret only).
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD in .env}
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
    ports:
      - "${KEYCLOAK_PORT:-8088}:8080"
    volumes:
      - ./keycloak/import:/opt/keycloak/data/import:ro
      - keycloak_data:/opt/keycloak/data

volumes:
  db_data:
  files_data:
  keycloak_data:
